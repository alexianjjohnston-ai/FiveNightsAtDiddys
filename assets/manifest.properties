# then graded ("grade = saturation red green blue contrast"). "eyes" are glow points; "face" is the
# x,y,w,h crop used for jumpscares and close-ups. A missing photo shows a labelled placeholder.
# Transparent PNG cutouts work too: leave "outline" empty.
