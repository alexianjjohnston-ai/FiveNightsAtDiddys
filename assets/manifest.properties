# ---------------------------------------------------------------------------------------------------
# Text lines. text.intro.N shows under the night card, text.win.N on the 6 AM screen,
# text.lose.N are picked at random on Game Over (numbered from 1 with no gaps).
# ---------------------------------------------------------------------------------------------------
text.intro.2 = Tonight's session: Hypnotize
text.intro.3 = Tonight's session: Run This Town
text.intro.4 = Tonight's session: Can't Nobody Hold Me Down
text.intro.5 = Tonight's session: Watch the Throne
text.win.1   = Good job. See you tomorrow night.
text.win.2   = Session wrapped. Two nights down.
text.win.3   = Halfway through the week.
text.win.4   = One more night.
text.win.5   = That's the whole week. Payday.
text.lose.1  = You've been signed. Permanently.
text.lose.2  = Security has been dropped from the label.
text.lose.3  = That's a wrap.
text.lose.4  = Your contract has been terminated.
text.paycheck.memo = five nights, Platinum Studios

# ---------------------------------------------------------------------------------------------------
# Sounds: snd.<name> = file [gain dB]. Optional - a missing sound is skipped.
# power_down and chime_6am are generated PLACEHOLDERS (see tools/MakeAssets.java).
# ---------------------------------------------------------------------------------------------------
