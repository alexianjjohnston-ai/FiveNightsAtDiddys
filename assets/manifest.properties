sign.plaque_2      = office 902 132 92 172 0 plaque_gold b=0.6 | REASONABLE DOUBT | JAY-Z | ROC-A-FELLA RECORDS
sign.plaque_3      = office 998 136 92 172 0 plaque_gold b=0.55 | JUICY | THE NOTORIOUS B.I.G. | BAD BOY RECORDS
sign.vault_closed  = vault_closed 642 518 164 84 0 board b=0.55 | SESSION IN PROGRESS | DO NOT ENTER
sign.vault_open    = vault_open 642 518 164 84 0 board b=0.55 | RUNAWAY
sign.throne        = west_corner 495 30 290 360 -10 poster b=0.55 faces=jayz,kanye | WATCH THE THRONE | JAY-Z  ·  KANYE WEST | THE TOUR | ROC-A-FELLA  ·  ROC NATION  ·  DEF JAM
sign.policy        = east_corner 1030 55 200 190 10 paper b=0.6 | STUDIO POLICY | Sessions by appointment only. | No outside recording equipment. | No food or drink in the live room. | All guests sign in at the front desk. | Night security on duty 12 AM - 6 AM. | - Management
