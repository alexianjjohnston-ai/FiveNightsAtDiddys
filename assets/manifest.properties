# ---------------------------------------------------------------------------------------------------
# Signs, posters and banners painted onto rooms (they cover the original pizzeria signage):
#   sign.<name> = <room> x y w h rotation style [b=brightness] [faces=id,id] | line | line ...
# rooms: office stage lounge green_room vault_closed vault_open restrooms gear_closet west_hall
#        west_corner east_hall east_corner. styles: poster, paper, board, banner.
# poster lines = title | subtitle | tagline | small print; the first face is the headliner.
# plaque lines = title | artist | label.
# ---------------------------------------------------------------------------------------------------
sign.office_poster = office 530 132 248 223 0 poster b=0.62 faces=diddy,jayz,biggie,kanye | DIDDY'S | PLATINUM STUDIOS | LIVE 'TIL 6 AM | BAD BOY  ·  DEF JAM  ·  ROC-A-FELLA  ·  G.O.O.D. MUSIC
