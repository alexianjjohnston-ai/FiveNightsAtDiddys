# ---------------------------------------------------------------------------------------------------
# Placements: place.<room>.<who/state> = <character> x= y= h= [b=] [a=] [crop=x,y,w,h] [rot=] [fade=]
#   [shade=] [glow=1] [flip=1] [z=] [occ=x,y,w,h;x,y,w,h]
# x,y = bottom-centre anchor in the room image (rooms are 1600x720); h = drawn height of the crop;
# b = brightness, a = opacity, fade = bottom fraction that dissolves into shadow, shade = how much darker
# the bottom is than the top (default 0.45; lower for brightly lit spots), z = layer order,
# occ = rectangles of the room redrawn on top (doorframes, curtains) so the character stands behind them.
# ---------------------------------------------------------------------------------------------------
place.stage.jayz          = jayz   x=430  y=760 h=700 b=0.55 fade=0.35 shade=0.6 z=0
place.stage.biggie        = biggie x=860  y=760 h=720 b=0.6 fade=0.35 shade=0.6 z=1
place.stage.diddy         = diddy  x=1270 y=760 h=720 b=0.55 fade=0.35 shade=0.6 z=2

