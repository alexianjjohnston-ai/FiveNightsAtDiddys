snd.ambience_fan   = audio/ambience_fan.wav -4
snd.ambience_drone = audio/ambience_drone.wav -6
snd.light_buzz     = audio/light_buzz.wav -4
snd.door           = audio/door.wav -2
snd.knock          = audio/knock.wav 0
snd.run            = audio/run.wav 0
snd.scream         = audio/scream.wav -5
snd.blip           = audio/blip.wav -4
snd.static         = audio/static.wav -10
