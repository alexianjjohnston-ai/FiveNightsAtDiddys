# ---------------------------------------------------------------------------------------------------
# Sounds: snd.<name> = file [gain dB]. Optional - a missing sound is skipped.
# power_down and chime_6am are generated PLACEHOLDERS (see tools/MakeAssets.java).
# ---------------------------------------------------------------------------------------------------
